<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Only Photo Gallery</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
    </header>
    
    <main class="gallery">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744626753-eda81829f957?w=400&q=80" alt="Mountain Landscape">
            <div class="caption">Beautiful Mountains</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Forest path">
            <div class="caption">Forest Path</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=400&q=80" alt="Nature view">
            <div class="caption">Nature View</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=400&q=80" alt="Ocean Sunset">
            <div class="caption">Ocean Sunset</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=400&q=80" alt="Waterfall">
            <div class="caption">Majestic Waterfall</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=400&q=80" alt="Starry Night">
            <div class="caption">Starry Night</div>
        </div>
    </main>
</body>
</html>
