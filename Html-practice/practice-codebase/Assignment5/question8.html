<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Admin Dashboard</h1>
    </header>
    
    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <h2>Overview</h2>
            <div class="content-boxes">
                <div class="box">
                    <h3>Total Students</h3>
                    <p class="stat">1,250</p>
                </div>
                <div class="box">
                    <h3>Total Courses</h3>
                    <p class="stat">42</p>
                </div>
                <div class="box">
                    <h3>Active Teachers</h3>
                    <p class="stat">35</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
