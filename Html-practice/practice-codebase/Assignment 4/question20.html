<!DOCTYPE html>
<html>
<head>
    <!-- 1. title: Sets the name of the webpage displayed in the browser tab -->
    <title>Question 20 - Head Elements</title>
    
    <!-- 2. meta (charset): Specifies the character encoding for the HTML document (UTF-8 handles most characters) -->
    <meta charset="UTF-8">
    
    <!-- 3. meta (description): Provides a short description of the page, often used by search engines -->
    <meta name="description" content="A webpage demonstrating various important head elements for college assignment.">
    
    <!-- 4. meta (author): Defines the author or creator of the webpage -->
    <meta name="author" content="Ajay">
    
    <!-- 5. base: Specifies the default base URL for all relative links on this webpage -->
    <base href="https://www.example.com/" target="_blank">
    
    <!-- 6. link: Links an external resource to the document, in this case, a website icon (favicon) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- 7. style: Used to write internal CSS code to style the webpage (kept empty as per instructions) -->
    <style></style>
    
    <!-- 8. script: Used to write internal JavaScript code or link external scripts (kept empty as per instructions) -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements Included</h1>
    <p>Right-click and select "View Page Source" to see all the head elements and the comments explaining them.</p>
</body>
</html>
