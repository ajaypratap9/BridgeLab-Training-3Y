<!DOCTYPE html>
<html>
<head>
    <title>Question 18 - Quotations</title>
</head>
<body>
    <h1>Quotations Example</h1>
    
    <!-- A long quotation using blockquote -->
    <blockquote cite="https://www.example.com">
        HTML is the standard markup language for documents designed to be displayed in a web browser. It can be assisted by technologies such as Cascading Style Sheets and scripting languages such as JavaScript.
    </blockquote>
    
    <!-- A short quotation using q inside another paragraph, including an HTML entity -->
    <p>My computer science professor often says, <q>Always close your &lt;html&gt; tags!</q></p>
</body>
</html>
