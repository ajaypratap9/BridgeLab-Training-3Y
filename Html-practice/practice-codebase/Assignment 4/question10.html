<!DOCTYPE html>
<html>
<head>
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <!-- Full Name with placeholder -->
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. Ajay" required>
        <br><br>
        
        <!-- Email with placeholder -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="ajay@example.com" required>
        <br><br>
        
        <!-- Subject with placeholder -->
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter subject here" required>
        <br><br>
        
        <!-- Message textarea with placeholder -->
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea>
        <br><br>
        
        <!-- Submit Button -->
        <input type="submit" value="Send Message">
    </form>
</body>
</html>
