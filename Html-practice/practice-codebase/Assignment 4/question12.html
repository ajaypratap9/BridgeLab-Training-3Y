    <title>Question 12 - HTML Entities</title>

<body>
    <h1>HTML Entities Example</h1>
    
    <!-- Paragraph showing various HTML entities -->
    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos; <br>
        <br>
        Copyright: &copy; <br>
        Trademark: &trade; <br>
        Registered: &reg;
    </p>
</body>
