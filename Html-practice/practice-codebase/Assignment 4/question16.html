<!DOCTYPE html>
<html>
<head>
    <title>Question 16 - URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>
    
    <p>Unencoded URL (incorrect format):<br>
    https://example.com/search?query=HTML & CSS</p>
    
    <!-- Using proper URI encoding: %20 represents a space, and %26 represents the ampersand (&) symbol -->
    <p>Properly Encoded URL:<br>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML & CSS</a>
    </p>
</body>
</html>
