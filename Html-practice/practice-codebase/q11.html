<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Span Elements Example</title>
</head>
<body>
  <!-- Three <span> elements used to label different parts of the text -->
  <p>
    I am a
    <span>B.Tech Computer Science student</span>
    who enjoys
    <span>coding</span>
    and has a strong interest in
    <span>cybersecurity</span>.
  </p>
</body>
</html>
