<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strong and Emphasis Together</title>
</head>
<body>
  <!-- Paragraph using both <strong> and <em> to emphasize different parts -->
  <p>
    <strong>Consistency</strong> is the key to becoming a good programmer, and
    <em>curiosity</em> is what keeps the learning process fun and exciting.
  </p>
</body>
</html>
