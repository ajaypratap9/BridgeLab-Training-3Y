<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="gallery-container">
        <figure>
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1506744626753-eda81829f957?w=400&q=80" alt="Mountain">
            </div>
            <figcaption>Majestic Mountains</figcaption>
        </figure>
        <figure>
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Forest">
            </div>
            <figcaption>Deep Forest</figcaption>
        </figure>
        <figure>
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=400&q=80" alt="Waterfall">
            </div>
            <figcaption>Hidden Waterfall</figcaption>
        </figure>
        <figure>
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=400&q=80" alt="Ocean">
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>
    </div>
</body>
</html>
