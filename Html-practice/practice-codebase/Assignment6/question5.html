<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing Section</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>
    <h1 class="page-title">Our Pricing Plans</h1>
    <div class="pricing-container">
        <div class="card">
            <h2>Basic</h2>
            <p class="price">$10/mo</p>
            <p>1 User</p>
            <p>10GB Storage</p>
        </div>
        <div class="card standard">
            <h2>Standard</h2>
            <p class="price">$25/mo</p>
            <p>5 Users</p>
            <p>50GB Storage</p>
        </div>
        <div class="card">
            <h2>Premium</h2>
            <p class="price">$50/mo</p>
            <p>Unlimited Users</p>
            <p>500GB Storage</p>
        </div>
    </div>
</body>
</html>
