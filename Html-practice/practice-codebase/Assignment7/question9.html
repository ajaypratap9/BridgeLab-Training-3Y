<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>
    <main>
        <header>
            <h1>Outline and Focus Styling</h1>
            <p>Each field below has a visible outline on focus. Notice how the
               <code>outline-offset</code> pushes the outline slightly away from the
               border, and how <code>:focus</code> changes its color. Click or tab
               between the fields to see the effect.</p>
        </header>

        <!-- Semantic form with labels (Flexbox centers the whole card) -->
        <section class="form-card">
            <form class="contact-form" action="#" method="post">

                <h2>Contact Form</h2>

                <div class="field-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name"
                           placeholder="e.g. Ananya Sharma">
                </div>

                <div class="field-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com">
                </div>

                <div class="field-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject">
                        <option value="question">General Question</option>
                        <option value="feedback">Feedback</option>
                        <option value="help">Technical Support</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-button">Send Message</button>

            </form>
        </section>
    </main>
</body>
</html>
