<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Code Example</title>
</head>
<body>
  <!-- Inline JavaScript code displayed using the <code> tag (not executed) -->
  <p>
    In JavaScript, you can print a message to the console using
    <code>console.log("Hello World");</code>
  </p>
</body>
</html>
