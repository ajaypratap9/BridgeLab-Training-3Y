<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark and Small Tags</title>
</head>
<body>
  <!-- Paragraph using <mark> for a highlighted word and <small> for a small note -->
  <p>
    I am currently focusing on improving my
    <mark>web development</mark> skills through daily practice.
    <small>Updated recently</small>
  </p>
</body>
</html>
