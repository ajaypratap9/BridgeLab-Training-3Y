<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Paragraph with Inline Elements</title>
</head>
<body>
  <!-- Creative paragraph combining multiple inline HTML elements -->
  <p>
    I take <strong>pride</strong> in writing clean code because I believe
    <em>quality</em> matters more than quantity.<br>
    My main focus right now is <mark>web development</mark>, and I plan to
    build real projects to sharpen my skills.
    <small>Last updated recently</small>
  </p>
</body>
</html>
